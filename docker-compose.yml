version: '3.8'

services:
  sentinel:
    build: .
    container_name: server-sentinel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - ALLOWED_AUTO_HEAL_CONTAINERS=${ALLOWED_AUTO_HEAL_CONTAINERS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/app/config

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: server-sentinel-ui
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - ORIGIN=http://localhost:3000
    depends_on:
      - sentinel