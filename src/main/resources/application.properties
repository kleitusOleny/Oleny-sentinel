spring.application.name=server-sentinel

spring.task.scheduling.pool.size=1

discord.webhook.url=${DISCORD_WEBHOOK_URL:}
# cách khai báo các app cần được tự động khởi động lại nếu crash
# ALLOWED_AUTO_HEAL_CONTAINERS=app-bi-sap1,app-bi-sap2
sentinel.auto-heal.allowed=${ALLOWED_AUTO_HEAL_CONTAINERS:}

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=2000MB
spring.servlet.multipart.max-request-size=2000MB

# MinIO Configuration
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.external-endpoint=${MINIO_EXTERNAL_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:sentineladmin}
minio.secret-key=${MINIO_SECRET_KEY:sentinelpassword123}
minio.bucket-name=${MINIO_BUCKET:sentinel-files}